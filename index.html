<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Lab Robot</title>
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<header>
  <div class="entete-ligne">
    <svg id="visage" viewBox="0 0 100 100" width="120" height="120" aria-label="Visage du robot">
            
      <!-- Antenne -->
      <line x1="50" y1="14" x2="50" y2="24" stroke="#4a9edd" stroke-width="3"/>
      <circle id="visage-antenne" cx="50" cy="12" r="4" fill="#4a9edd"/>
      <!-- Tête -->
      <rect x="14" y="24" width="72" height="60" rx="14" fill="#1e2a38" stroke="#4a9edd" stroke-width="3"/>
      <!-- Écran visage -->
      <rect x="22" y="34" width="56" height="40" rx="8" fill="#0d1620"/>
      <!-- Oeil gauche -->
      <ellipse id="visage-oeil-g" cx="38" cy="50" rx="7" ry="8" fill="#4ad6a5"/>
      <!-- Oeil droit -->
      <ellipse id="visage-oeil-d" cx="62" cy="50" rx="7" ry="8" fill="#4ad6a5"/>
      <!-- Bouche -->
      <path id="visage-bouche" d="M 40 64 Q 50 70 60 64" stroke="#4ad6a5" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Joues (visibles en joie) -->
      <circle id="visage-joie-g" cx="30" cy="60" r="3" fill="#e8746a" opacity="0"/>
      <circle id="visage-joie-d" cx="70" cy="60" r="3" fill="#e8746a" opacity="0"/>
      
      <!-- Accessoires météo : en DERNIER pour passer DEVANT la tête -->
      <g id="visage-meteo"></g>
      <!-- Ambiance jour/nuit : lune et étoiles la nuit -->
      <g id="visage-nuit"></g>
    </svg>
    <div class="entete-texte">
      <h1>🤖 Web Lab Robot</h1>
      <p id="status">Initialisation...</p>
    </div>
  </div>
</header>
  <main>
  

    <section class="card">
      <h2>💬 Dialogue </h2>
      <div class="dialogue-zone">
        <input type="text" id="dialogue-input" placeholder="Pose ta question au robot...">
        <button id="dialogue-send">Envoyer</button>
      </div>
    </section>
    <section class="card">
      <h2>⚙️ Réglages du robot</h2>
      <div class="dialogue-zone">
        <input type="text" id="setup-nom" placeholder="Ton prénom (ex : Jean-Louis)">
        <input type="text" id="setup-nom-robot" placeholder="Nom du robot">
        <input type="text" id="setup-ville" placeholder="Ville de référence météo (ex : Plouay)">
                <textarea id="setup-paraphrases" rows="3" placeholder="Paraphrases — une par ligne :&#10;frangin = frère&#10;vit à = habite à"></textarea>
        <button id="btn-setup">Enregistrer</button>
      </div>
    </section>
  <section class="card">
  <h2>🧠 Mémoire du robot</h2>
  <p id="memoire-info">Faits mémorisés — cliquer sur ✖ pour supprimer un fait.</p>
  <div id="memoire-liste"></div>
  <div class="memoire-zone">
    <button id="btn-export">📤 Exporter</button>
    <button id="btn-import">📥 Importer</button>
    <button id="btn-reset">🗑️ Tout effacer</button>
    <input type="file" id="fichier-import" accept=".json" hidden>
  </div>
</section>

    <section class="card">
      <h2>Console du robot</h2>
      <div id="console"></div>
    </section>
  </main>

  <footer>
    <p>Web Lab Robot — projet de laboratoire, sans données personnelles.</p>
  </footer>

  <script src="js/console.js?v=7"></script>
  <script src="js/visage.js?v=7"></script>
  <script src="js/config.js?v=7"></script>
  <script src="js/setup.js?v=7"></script>
  <script src="js/memoire.js?v=7"></script>
  <script src="js/meteo.js?v=7"></script>
  <script src="js/wikipedia.js?v=7"></script>
  <script src="js/actus.js?v=9"></script>
  <script src="js/modules.js?v=7"></script>
  <script src="js/app.js?v=7"></script>
  <script src="https://js.puter.com/v2/"></script>
</body>
</html>
